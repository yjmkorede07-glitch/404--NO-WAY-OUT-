<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>404: NO WAY OUT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div>
            <div class="game-title">404: NO WAY OUT</div>
            <div class="location">VEYRON CITY</div>
        </div>

        <div class="player-money">
            <div>Cash</div>
            <strong id="cashDisplay">$0</strong>
        </div>
    </header>


    <main class="game-container">

        <section class="player-card">
            <div class="avatar-placeholder">DC</div>

            <div>
                <h2>Darius Cole</h2>
                <p>Age 24</p>
                <p class="status">Available</p>
            </div>
        </section>


        <section class="bank-card">

            <div class="bank-header">
                <div>
                    <span class="small-label">BANK ACCOUNT</span>
                    <h2 id="bankBalance">$0</h2>
                </div>

                <div class="card-chip">▣</div>
            </div>

            <div class="card-number">
                4040 •••• •••• 0001
            </div>

            <div class="card-footer">
                <span>DARIUS COLE</span>
                <span>DEBIT</span>
            </div>

        </section>


        <section class="menu">

            <button onclick="openATM()">
                ATM
            </button>

            <button onclick="openTransfer()">
                Transfer Money
            </button>

            <button onclick="openTransactions()">
                Transaction History
            </button>

            <button onclick="resetGame()" class="danger">
                Reset Test Account
            </button>

        </section>


        <section id="panel" class="panel hidden">
        </section>

    </main>


    <script src="js/storage.js"></script>
    <script src="js/player.js"></script>
    <script src="js/banking.js"></script>
    <script src="js/game.js"></script>

</body>
</html>
